<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/auth.css">
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="../css/agendamentos.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

    </svg>
    Clínica Alvea
  </a>

  <nav class="admin-nav">
    <a href="dashboard.html" class="admin-nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      Dashboard
    </a>
    <a href="profissionais.html" class="admin-nav-link">

      Profissionais
    </a>
    <a href="agendamentos.html" class="admin-nav-link active">

      Agendamentos
    </a>
    <a href="exames.html" class="admin-nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 2v6L4 20a1 1 0 001 1h14a1 1 0 001-1L15 8V2M9 2h6M9 14h6"/></svg>
      Exames
    </a>
    <a href="pacientes.html" class="admin-nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>

      Contatos

  <div class="admin-sidebar-foot">
    <div class="admin-user-mini">
      <div class="avatar" id="userAvatar">--</div>
      <div>
        <div class="name" id="userName">Carregando...</div>
        <div class="role">Administrador</div>
      </div>
    </div>
    <button class="admin-logout-link" id="logoutBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      Sair
    </button>
  </div>
</aside>

<div class="admin-content">
  <main class="admin-main">

    <div class="admin-page-header">
      <div>
        <h1>Agendamentos</h1>
        <p>Acompanhe e gerencie todas as consultas marcadas na clínica.</p>
      </div>
    </div>

    <div class="admin-filters">
      <select id="filtroStatus">
        <option value="">Todos os status</option>
        <option value="confirmado">Confirmado</option>
        <option value="concluido">Concluído</option>
        <option value="cancelado">Cancelado</option>
      </select>
      <select id="filtroProfissional">
        <option value="">Todos os profissionais</option>
      </select>
      <input type="date" id="filtroData">
    </div>

    <div class="admin-table-card">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Data / Hora</th>
            <th>Paciente</th>
            <th>Especialidade</th>
            <th>Profissional</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tabelaCorpo">
          <tr><td colspan="6" class="table-empty">Carregando agendamentos...</td></tr>
        </tbody>
      </table>
    </div>

  </main>
</div>

<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script>
  const sessao = alveaRequireAdmin();
  let TODOS_AGENDAMENTOS = [];
  let MAPA_PACIENTES = {};
  let PROFISSIONAIS = [];

  if (sessao) {
    const { usuario } = sessao;
    const iniciais = usuario.nome.split(' ').filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join('');
    document.getElementById('userName').textContent = usuario.nome;
    document.getElementById('userAvatar').textContent = iniciais;
  }

  document.getElementById('logoutBtn').addEventListener('click', () => alveaLogout('../paciente/login.html'));

  const authHeaders = () => ({ Authorization: `Bearer ${sessao.token}` });

  const LABELS_STATUS = { confirmado: 'Confirmado', concluido: 'Concluído', cancelado: 'Cancelado' };

  function formatarDataHora(iso) {
    const data = new Date(iso);
    return data.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' }) +
      ' às ' + data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  function renderizarTabela() {
    const corpo = document.getElementById('tabelaCorpo');

    if (!TODOS_AGENDAMENTOS.length) {
      corpo.innerHTML = '<tr><td colspan="6" class="table-empty">Nenhum agendamento encontrado com esses filtros.</td></tr>';
      return;
    }

    corpo.innerHTML = TODOS_AGENDAMENTOS.map((ag) => {
      const nomePaciente = MAPA_PACIENTES[ag.pacienteId] || 'Paciente não encontrado';
      const podeAlterar = ag.status === 'confirmado';

      return `
        <tr>
          <td class="cell-strong">${formatarDataHora(ag.dataHora)}</td>
          <td>${nomePaciente}${ag.paraNome ? ` <span class="cell-muted">(para ${ag.paraNome})</span>` : ''}</td>
          <td>${ag.especialidade}</td>
          <td class="cell-muted">${ag.profissionalNome}</td>
          <td><span class="status-badge ${ag.status}">${LABELS_STATUS[ag.status] || ag.status}</span></td>
          <td>
            ${podeAlterar ? `
              <div class="table-actions">
                <button class="icon-btn" data-conclude="${ag.id}" title="Marcar como concluído">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
                </button>
                <button class="icon-btn danger" data-cancel="${ag.id}" title="Cancelar agendamento">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
              </div>` : ''}
          </td>
        </tr>`;
    }).join('');

    corpo.querySelectorAll('[data-conclude]').forEach((btn) => {
      btn.addEventListener('click', () => alterarStatus(btn.dataset.conclude, 'concluido'));
    });
    corpo.querySelectorAll('[data-cancel]').forEach((btn) => {
      btn.addEventListener('click', () => alterarStatus(btn.dataset.cancel, 'cancelado'));
    });
  }

  async function alterarStatus(id, novoStatus) {
    try {
      await alveaApiRequest(`/admin/agendamentos/${id}/status`, {
        method: 'PUT',
        headers: authHeaders(),
        body: JSON.stringify({ status: novoStatus }),
      });
      const item = TODOS_AGENDAMENTOS.find((a) => a.id === id);
      if (item) item.status = novoStatus;
      renderizarTabela();
    } catch (erro) {
      alveaToast(erro.message, 'error');
    }
  }

  /* ---------- Filtros ---------- */

  function montarQueryFiltros() {
    const params = new URLSearchParams();
    const status = document.getElementById('filtroStatus').value;
    const profissionalId = document.getElementById('filtroProfissional').value;
    const data = document.getElementById('filtroData').value;

    if (status) params.set('status', status);
    if (profissionalId) params.set('profissionalId', profissionalId);
    if (data) params.set('data', data);

    return params.toString();
  }

  async function aplicarFiltros() {
    const query = montarQueryFiltros();
    document.getElementById('tabelaCorpo').innerHTML = '<tr><td colspan="6" class="table-empty">Carregando...</td></tr>';

    try {
      TODOS_AGENDAMENTOS = await alveaApiRequest(`/admin/agendamentos${query ? '?' + query : ''}`, {
        headers: authHeaders(),
      });
      TODOS_AGENDAMENTOS.sort((a, b) => new Date(b.dataHora) - new Date(a.dataHora));
      renderizarTabela();
    } catch (erro) {
      document.getElementById('tabelaCorpo').innerHTML = `<tr><td colspan="6" class="table-empty">${erro.message}</td></tr>`;
    }
  }

  ['filtroStatus', 'filtroProfissional', 'filtroData'].forEach((id) => {
    document.getElementById(id).addEventListener('change', aplicarFiltros);
  });

  /* ---------- Carregamento inicial ---------- */

  async function carregarDadosIniciais() {
    try {
      const [pacientes, profissionais] = await Promise.all([
        alveaApiRequest('/admin/pacientes', { headers: authHeaders() }),
        alveaApiRequest('/profissionais'),
      ]);

      MAPA_PACIENTES = Object.fromEntries(pacientes.map((p) => [p.id, p.nome]));
      PROFISSIONAIS = profissionais;

      const selectProf = document.getElementById('filtroProfissional');
      profissionais.forEach((prof) => {
        const option = document.createElement('option');
        option.value = prof.id;
        option.textContent = prof.nome;
        selectProf.appendChild(option);
      });

      await aplicarFiltros();
    } catch (erro) {
      document.getElementById('tabelaCorpo').innerHTML = `<tr><td colspan="6" class="table-empty">${erro.message}</td></tr>`;
    }
  }

  if (sessao) {
    carregarDadosIniciais();
  }
</script>
</body>
</html>

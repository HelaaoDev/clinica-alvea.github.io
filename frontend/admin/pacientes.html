<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="../css/agendamentos.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

      <path d="M6 21h5l2.5-7 4 14 3-9 2 3h11.5" stroke="#3FA796" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    Clínica Alvea
  </a>

  <nav class="admin-nav">
    <a href="dashboard.html" class="admin-nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      Dashboard
    </a>
    <a href="profissionais.html" class="admin-nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      Profissionais
    </a>
    <a href="agendamentos.html" class="admin-nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Agendamentos
    </a>
    <a href="exames.html" class="admin-nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 2v6L4 20a1 1 0 001 1h14a1 1 0 001-1L15 8V2M9 2h6M9 14h6"/></svg>
      Exames
    </a>
    <a href="pacientes.html" class="admin-nav-link active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
      Pacientes
    </a>
    <a href="contatos.html" class="admin-nav-link">

      Contatos

  <div class="admin-sidebar-foot">
    <div class="admin-user-mini">
      <div class="avatar" id="userAvatar">--</div>
      <div>
        <div class="name" id="userName">Carregando...</div>
        <div class="role">Administrador</div>
      </div>
    </div>
    <button class="admin-logout-link" id="logoutBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      Sair
    </button>
  </div>
</aside>

<div class="admin-content">
  <main class="admin-main">

    <div class="admin-page-header">
      <div>
        <h1>Pacientes</h1>
        <p>Consulte os pacientes cadastrados na plataforma.</p>
      </div>
    </div>

    <div class="admin-filters">
      <input type="text" id="buscaInput" placeholder="Buscar por nome, CPF ou e-mail..." style="min-width:280px;">
    </div>

    <div class="admin-table-card">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Nome</th>
            <th>CPF</th>
            <th>E-mail</th>
            <th>Cadastrado em</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tabelaCorpo">
          <tr><td colspan="5" class="table-empty">Carregando pacientes...</td></tr>
        </tbody>
      </table>
    </div>

  </main>
</div>

<!-- Modal de confirmação de exclusão -->
<div class="modal-overlay" id="deleteModalOverlay">
  <div class="modal-box">
    <div class="modal-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
    </div>
    <h3>Excluir paciente?</h3>
    <p id="deleteModalText">Essa ação não pode ser desfeita.</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="deleteCancelBtn">Voltar</button>
      <button class="btn btn-primary" id="deleteConfirmBtn" style="background:var(--alvea-danger); box-shadow:none;">Sim, excluir</button>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script>
  const sessao = alveaRequireAdmin();
  let TODOS_PACIENTES = [];

  if (sessao) {
    const { usuario } = sessao;
    const iniciais = usuario.nome.split(' ').filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join('');
    document.getElementById('userName').textContent = usuario.nome;
    document.getElementById('userAvatar').textContent = iniciais;
  }

  document.getElementById('logoutBtn').addEventListener('click', () => alveaLogout('../paciente/login.html'));

  function formatarData(iso) {
    return new Date(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function renderizarTabela(lista) {
    const corpo = document.getElementById('tabelaCorpo');

    if (!lista.length) {
      corpo.innerHTML = '<tr><td colspan="5" class="table-empty">Nenhum paciente encontrado.</td></tr>';
      return;
    }

    corpo.innerHTML = lista.map((p) => `
      <tr>
        <td class="cell-strong">${p.nome}</td>
        <td class="cell-muted">${p.cpf || '—'}</td>
        <td class="cell-muted">${p.email}</td>
        <td class="cell-muted">${formatarData(p.criadoEm)}</td>
        <td>
          <div class="table-actions">
            <button class="icon-btn danger" data-delete="${p.id}" title="Excluir paciente">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
            </button>
          </div>
        </td>
      </tr>
    `).join('');

    corpo.querySelectorAll('[data-delete]').forEach((btn) => {
      btn.addEventListener('click', () => abrirModalExclusao(btn.dataset.delete));
    });
  }

  /* ---------- Modal de exclusão ---------- */

  const deleteModalOverlay = document.getElementById('deleteModalOverlay');
  const deleteConfirmBtn = document.getElementById('deleteConfirmBtn');
  let idParaExcluir = null;

  function abrirModalExclusao(id) {
    const paciente = TODOS_PACIENTES.find((p) => p.id === id);
    idParaExcluir = id;
    document.getElementById('deleteModalText').textContent =
      `Tem certeza que deseja excluir ${paciente ? paciente.nome : 'este paciente'}? Todos os agendamentos, exames e dados vinculados também serão excluídos permanentemente. Essa ação não pode ser desfeita.`;
    deleteModalOverlay.classList.add('show');
  }

  function fecharModalExclusao() {
    deleteModalOverlay.classList.remove('show');
    idParaExcluir = null;
  }

  document.getElementById('deleteCancelBtn').addEventListener('click', fecharModalExclusao);
  deleteModalOverlay.addEventListener('click', (e) => { if (e.target === deleteModalOverlay) fecharModalExclusao(); });

  deleteConfirmBtn.addEventListener('click', async () => {
    if (!idParaExcluir) return;

    deleteConfirmBtn.disabled = true;
    deleteConfirmBtn.textContent = 'Excluindo...';

    try {
      await alveaApiRequest(`/admin/pacientes/${idParaExcluir}`, {
        method: 'DELETE',
        headers: { Authorization: `Bearer ${sessao.token}` },
      });

      TODOS_PACIENTES = TODOS_PACIENTES.filter((p) => p.id !== idParaExcluir);
      renderizarTabela(TODOS_PACIENTES);
      fecharModalExclusao();
    } catch (erro) {
      alveaToast(erro.message, 'error');
    } finally {
      deleteConfirmBtn.disabled = false;
      deleteConfirmBtn.textContent = 'Sim, excluir';
    }
  });

  document.getElementById('buscaInput').addEventListener('input', (e) => {
    const termo = e.target.value.toLowerCase().trim();
    const filtrados = TODOS_PACIENTES.filter((p) =>
      p.nome.toLowerCase().includes(termo) ||
      (p.cpf || '').includes(termo) ||
      p.email.toLowerCase().includes(termo)
    );
    renderizarTabela(filtrados);
  });

  async function carregarPacientes() {
    try {
      TODOS_PACIENTES = await alveaApiRequest('/admin/pacientes', {
        headers: { Authorization: `Bearer ${sessao.token}` },
      });
      renderizarTabela(TODOS_PACIENTES);
    } catch (erro) {
      document.getElementById('tabelaCorpo').innerHTML = `<tr><td colspan="5" class="table-empty">${erro.message}</td></tr>`;
    }
  }

  if (sessao) {
    carregarPacientes();
  }
</script>
</body>
</html>
